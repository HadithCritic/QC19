[package]
name = "qurancode-desktop"
version = "0.1.0"
description = "QuranCode: numerical research over the text of the Quran"
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "qurancode_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
